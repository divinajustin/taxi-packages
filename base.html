<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }}: Kerala taxi packages from {{ site.base_city }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.tagline }} Fixed-price taxi packages to Munnar, Alleppey, Thekkady and more. Book on WhatsApp.{% endblock %}">
  <link rel="canonical" href="{{ site.url }}{{ page_path }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0E4B4F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@500;700;800&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TaxiService",
    "name": {{ site.name | tojson }},
    "url": {{ site.url | tojson }},
    "telephone": {{ ("+" ~ site.phone) | tojson }},
    "areaServed": "Kerala, India",
    "provider": {
      "@type": "LocalBusiness",
      "name": {{ site.name | tojson }},
      "address": {{ site.address | tojson }},
      "telephone": {{ ("+" ~ site.phone) | tojson }}
    }
  }
  </script>
</head>
<body>
  <div class="kasavu" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="/">{{ site.name }}</a>
    <nav>
      <a href="/#packages">Packages</a>
      <a href="/#vehicles">Vehicles</a>
      <a href="/#contact">Contact</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer id="contact" class="footer">
    <div class="kasavu" aria-hidden="true"></div>
    <div class="wrap footer-grid">
      <div>
        <p class="footer-name">{{ site.name }}</p>
        <p>{{ site.address }}</p>
        <p>{{ site.hours }}</p>
      </div>
      <div class="footer-links">
        <a href="tel:+{{ site.phone }}">Call +{{ site.phone }}</a>
        <a href="{{ site.wa_general }}" rel="noopener">Message on WhatsApp</a>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        <a href="{{ site.maps_url }}" rel="noopener">Open in Google Maps</a>
      </div>
    </div>
    <p class="wrap copyright">&copy; {{ year }} {{ site.name }}</p>
  </footer>

  <div class="actionbar">
    <a class="btn btn-call" href="tel:+{{ site.phone }}">Call</a>
    <a class="btn btn-wa" href="{% block wa_link %}{{ site.wa_general }}{% endblock %}" rel="noopener">WhatsApp</a>
  </div>
</body>
</html>
